name: packslip

# Signs a packslip for a release and attaches it, so `mise use
# packslip:github.com/zerodahero/korin` installs korin with its skill. release.yml calls
# this after the release is announced (dist's `post-announce-jobs`). Signing runs with
# read-only contents; a second job uploads the bundle.
on:
  workflow_call:
    inputs:
      plan:
        description: dist's release plan, as JSON
        required: true
        type: string

permissions: {}

jobs:
  sign:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ fromJson(inputs.plan).announcement_tag }}
      - name: Check that the skill is in the release commit
        run: git cat-file -e "$(git rev-parse HEAD):skills/korin/SKILL.md"
      - uses: jdx/packslip@9d5b1c469ba90d26b6dbd0a0162e84a95da524d5 # v1.11.5
        id: packslip
        with:
          tag: ${{ fromJson(inputs.plan).announcement_tag }}
          download: korin-*.tar.xz
          bin: korin
          resources: |
            skill/korin=repo:skills/korin
          upload: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  upload:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip
          path: packslip
      - name: Attach the packslip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: gh release upload "$TAG" packslip/packslip.sigstore.json --repo "$GITHUB_REPOSITORY" --clobber
