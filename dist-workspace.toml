[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# release.yml is pinned by pinact and hardened for zizmor after generation.
allow-dirty = ["ci"]

# Every target is static musl, so the old glibc on dist's default ubuntu-22.04 buys nothing.
# Pinned like ci.yml: a floating `ubuntu-latest` would change the release image unannounced.
[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
